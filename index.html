<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MARSKEY AFFILIATE AI Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #030712; color: #f8fafc; }
        
        .bg-grid {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -2;
            background-size: 50px 50px;
            background-image:
                linear-gradient(to right, rgba(255, 255, 255, 0.012) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.012) 1px, transparent 1px);
            pointer-events: none;
        }

        .ambient-glow-1 {
            position: fixed; width: 60vw; height: 60vw;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.12) 0%, rgba(0,0,0,0) 60%);
            top: -20vw; left: -20vw; z-index: -1; pointer-events: none;
        }
        .ambient-glow-2 {
            position: fixed; width: 50vw; height: 50vw;
            background: radial-gradient(circle, rgba(20, 184, 166, 0.08) 0%, rgba(0,0,0,0) 60%);
            bottom: -10vw; right: -10vw; z-index: -1; pointer-events: none;
        }
        .ambient-glow-3 {
            position: fixed; width: 40vw; height: 40vw;
            background: radial-gradient(circle, rgba(132, 204, 22, 0.08) 0%, rgba(0,0,0,0) 60%);
            top: 40%; left: 30%; z-index: -1; pointer-events: none;
        }

        .glass-panel {
            background: linear-gradient(180deg, rgba(20, 20, 25, 0.6) 0%, rgba(10, 10, 15, 0.8) 100%);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-top: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255,255,255,0.05);
        }

        .glass-input {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #f8fafc;
            transition: all 0.2s ease;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
        }
        .glass-input:focus {
            background: rgba(15, 15, 20, 0.8);
            border-color: rgba(16, 185, 129, 0.6);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2), inset 0 1px 2px rgba(0, 0, 0, 0.3);
            outline: none;
        }

        .marketing-btn {
            background-size: 200% auto;
            transition: all 0.4s ease;
        }
        .marketing-btn:hover {
            background-position: right center;
            transform: translateY(-2px);
        }
        .marketing-btn:active {
            transform: translateY(1px);
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #030712; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; border: 2px solid #030712; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(16, 185, 129, 0.8); }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
    </style>
</head>
<body class="relative min-h-screen overflow-x-hidden selection:bg-emerald-500 selection:text-white">
    <div class="bg-grid"></div>
    <div class="ambient-glow-1"></div>
    <div class="ambient-glow-2"></div>
    <div class="ambient-glow-3"></div>
    
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const App = () => {
            const [isAuthorized, setIsAuthorized] = useState(false);
            const [inputToken, setInputToken] = useState('');
            const [tokenError, setTokenError] = useState('');
            const [showToken, setShowToken] = useState(false);
            
            const VALID_TOKENS = [
                'ADM11', 'adm11', 'AFFILIATE2026', 'PRODEV',
                'MK-X7B9A', 'MK-2P4F8', 'MK-9L3DZ', 'MK-W5K1M',
                'MK-Q8R2T', 'MK-4N6YH', 'MK-C3V7J', 'MK-M9E4W',
                'MK-T1H5P', 'MK-7F2RK'
            ];

            const handleTokenSubmit = (e) => {
                e.preventDefault();
                if (VALID_TOKENS.includes(inputToken.trim())) {
                    setIsAuthorized(true);
                    setTokenError('');
                } else {
                    setTokenError('Kode Token tidak valid atau sudah kadaluarsa!');
                }
            };

            const [activeTab, setActiveTab] = useState('generator');

            const [productName, setProductName] = useState('');
            const [productCategory, setProductCategory] = useState('');
            const [bgLocation, setBgLocation] = useState('');
            const [bgLocationCustom, setBgLocationCustom] = useState('');
            const bgLocationOptions = ['Living Room', 'Bedroom', 'Kitchen', 'Office', 'Bathroom', 'Outdoor', 'Gaming Room', 'Store', 'Custom'];

            const [productImage, setProductImage] = useState(null);
            const [productImagePreview, setProductImagePreview] = useState(null);
            const [characterImage, setCharacterImage] = useState(null);
            const [characterImagePreview, setCharacterImagePreview] = useState(null);
            const [backgroundImage, setBackgroundImage] = useState(null);
            const [backgroundImagePreview, setBackgroundImagePreview] = useState(null);
            
            const [ugcStyle, setUgcStyle] = useState('');
            const [displayMethod, setDisplayMethod] = useState('');
            const [sceneCount, setSceneCount] = useState('4');
            const [productDetailExtra, setProductDetailExtra] = useState('');

            const [sbProductName, setSbProductName] = useState('');
            const [sbProductCategory, setSbProductCategory] = useState('');
            const [sbBgLocation, setSbBgLocation] = useState('');
            const [sbBgLocationCustom, setSbBgLocationCustom] = useState('');
            
            const [sbProductImage, setSbProductImage] = useState(null);
            const [sbProductImagePreview, setSbProductImagePreview] = useState(null);
            const [sbCharacterImage, setSbCharacterImage] = useState(null);
            const [sbCharacterImagePreview, setSbCharacterImagePreview] = useState(null);
            const [sbBackgroundImage, setSbBackgroundImage] = useState(null);
            const [sbBackgroundImagePreview, setSbBackgroundImagePreview] = useState(null);
            
            const [sbUgcStyle, setSbUgcStyle] = useState('');
            const [sbDisplayMethod, setSbDisplayMethod] = useState('');
            const [sbSceneCount, setSbSceneCount] = useState('4');
            const [sbProductDetailExtra, setSbProductDetailExtra] = useState('');
            const [sbAdditionalIdea, setSbAdditionalIdea] = useState(''); 

            const ugcStylesList = [
                { value: 'Casual Vlogging', label: 'Casual Vlogging', desc: 'Terlihat seperti direkam menggunakan HP sendiri, natural dan relatable. Cocok untuk memperlihatkan outfit saat dipakai berolahraga.' },
                { value: 'Problem-Solving Unboxing', label: 'Problem-Solving Unboxing', desc: 'Fokus membuka paket lalu menunjukkan bagaimana produk menjadi solusi praktis.' },
                { value: 'Aesthetic ASMR', label: 'Aesthetic ASMR', desc: 'Close-up kain, jahitan, tekstur, dan detail produk dengan sedikit atau tanpa bicara.' },
                { value: 'Testimony Style', label: 'Testimony Style', desc: 'Talent menghadap kamera dan memberikan pengalaman menggunakan produk. Kuat untuk membangun kepercayaan.' },
                { value: 'Unboxing', label: 'Unboxing', desc: 'Fokus pada tangan membuka paket, memperlihatkan kemasan, isi, dan first impression.' },
                { value: 'Before & After', label: 'Before & After', desc: 'Dimulai dari kondisi biasa → berubah menjadi solusi produk yang menakjubkan.' },
                { value: 'Demonstration Product', label: 'Demonstration Product', desc: 'Menunjukkan cara memakai atau menggunakan produk secara bertahap.' },
                { value: 'Day in the Life', label: 'Day in the Life', desc: 'Mengikuti aktivitas harian karakter dari persiapan hingga selesai.' },
                { value: 'Aesthetic-Product Showcase', label: 'Aesthetic-Product Showcase', desc: 'Visual bersih dan sinematik, menonjolkan desain, bahan, warna, dan detail.' },
                { value: 'Voice-Over', label: 'Voice-Over', desc: 'Karakter melakukan aktivitas sementara cerita produk disampaikan.' },
                { value: 'POV-Semi Drama', label: 'POV-Semi Drama', desc: 'Kamera seolah menjadi sudut pandang penonton dengan situasi relatable.' }
            ];

            const categories = ['Fashion Pria', 'Fashion Wanita', 'Elektronik', 'Sport', 'Skincare', 'Lainnya...'];
            const displayMethods = [
                { value: 'Pegang & Tunjukkan', label: 'Pegang & Tunjukkan (Handheld)' },
                { value: 'Dipakai/Dikenakan', label: 'Dipakai/Dikenakan (Try-On)' },
                { value: 'Diaplikasikan/Digunakan', label: 'Diaplikasikan/Digunakan (Action Use)' },
                { value: 'Diletakkan Estetik', label: 'Diletakkan Estetik (Flatlay)' },
                { value: 'Produk Saja', label: 'Produk Saja (B-Roll Tanpa Orang)' },
                { value: 'Zoom Detail', label: 'Zoom Detail (Macro Shot)' }
            ];

            const [isGenerating, setIsGenerating] = useState(false);
            const [generatedData, setGeneratedData] = useState(null);
            const [rawJsonText, setRawJsonText] = useState(''); 
            const [outputViewMode, setOutputViewMode] = useState('visual'); 
            const [iconError, setIconError] = useState(false);
            const [genError, setGenError] = useState(null);

            const [sceneImages, setSceneImages] = useState({});
            const [sceneIsGenerating, setSceneIsGenerating] = useState({});
            const [editablePrompts, setEditablePrompts] = useState({});

            const [copiedStatus, setCopiedStatus] = useState({});
            const [fullscreenImage, setFullscreenImage] = useState(null);
            
            const [sbStoryboardImagePreview, setSbStoryboardImagePreview] = useState(null);
            const [sbIsGeneratingImage, setSbIsGeneratingImage] = useState(false);
            const [sbImageError, setSbImageError] = useState(null);
            
            const [sbGeneratedVideoJson, setSbGeneratedVideoJson] = useState(null);
            const [sbIsGeneratingVideo, setSbIsGeneratingVideo] = useState(false);
            const [sbVideoError, setSbVideoError] = useState(null);

            const handleImageUpload = (e, setFile, setPreview) => {
                const file = e.target.files[0];
                if (file) {
                    setFile(file);
                    const reader = new FileReader();
                    reader.onloadend = () => setPreview(reader.result);
                    reader.readAsDataURL(file);
                }
            };

            const copyText = async (text, key) => {
                try {
                    await navigator.clipboard.writeText(text);
                } catch (err) {
                    const textArea = document.createElement("textarea");
                    textArea.value = text;
                    document.body.appendChild(textArea);
                    textArea.select();
                    document.execCommand("copy");
                    document.body.removeChild(textArea);
                }
                setCopiedStatus(prev => ({ ...prev, [key]: true }));
                setTimeout(() => setCopiedStatus(prev => ({ ...prev, [key]: false })), 2000);
            };

            const downloadImage = (dataUrl, filename) => {
                const link = document.createElement('a');
                link.href = dataUrl;
                link.download = filename;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const cleanJsonString = (str) => {
                return str.replace(/```json\n?/g, '').replace(/```\n?/g, '').trim();
            };

            const fetchGeminiText = async (prompt, isJson = false) => {
                const apiKey = ""; 
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
                
                const payload = {
                    contents: [{ parts: [{ text: prompt }] }],
                    generationConfig: { temperature: 0.8 }
                };

                if (isJson) {
                    payload.generationConfig.responseMimeType = "application/json";
                }
                
                const response = await fetch(apiUrl, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify(payload) 
                });
                
                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.error?.message || `HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                return data.candidates[0].content.parts[0].text;
            };

            const fetchGeminiImage = async (prompt, aspectRatio, prodImg, charImg, bgImg) => {
                const apiKey = ""; 
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-image:generateContent?key=${apiKey}`; 
                
                let parts = [];
                
                if (prodImg) {
                    const mime = prodImg.split(';')[0].split(':')[1];
                    const b64 = prodImg.split(',')[1];
                    parts.push({ inlineData: { mimeType: mime, data: b64 } });
                    parts.push({ text: "[REFERENSI PRODUK]: Gunakan bentuk, warna, dan detail fisik produk dari gambar pertama ini secara akurat." });
                }
                if (charImg) {
                    const mime = charImg.split(';')[0].split(':')[1];
                    const b64 = charImg.split(',')[1];
                    parts.push({ inlineData: { mimeType: mime, data: b64 } });
                    parts.push({ text: "[REFERENSI KARAKTER/TALENT]: Pertahankan wajah, ciri fisik, dan penampilan karakter dari gambar ini secara konsisten." });
                }
                if (bgImg) {
                    const mime = bgImg.split(';')[0].split(':')[1];
                    const b64 = bgImg.split(',')[1];
                    parts.push({ inlineData: { mimeType: mime, data: b64 } });
                    parts.push({ text: "[REFERENSI LATAR/BACKGROUND KUNCI UTAMA]: Gunakan ruangan, interior, dan suasana dari gambar latar ini sebagai setting tempat tetap. Jangan mengubah lokasi latar belakangnya." });
                }

                parts.push({ text: prompt });

                const payload = {
                    contents: [{ role: 'user', parts: parts }],
                    generationConfig: {
                        responseModalities: ['IMAGE'],
                        imageConfig: { aspectRatio: aspectRatio }
                    }
                };

                const response = await fetch(apiUrl, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify(payload) 
                });
                
                if (!response.ok) throw new Error("Gagal merender gambar");
                
                const result = await response.json();
                const part = result?.candidates?.[0]?.content?.parts?.find(p => p.inlineData);
                
                if (part) {
                    return `data:${part.inlineData.mimeType};base64,${part.inlineData.data}`;
                } else {
                    throw new Error("Tidak ada data gambar yang dihasilkan");
                }
            };

            const handleGenerateScript = async () => {
                if (!productName) {
                    setGenError("Nama produk wajib diisi bro!");
                    return;
                }
                
                setIsGenerating(true);
                setGenError(null);
                
                let displayAction = "";
                if (displayMethod === "Pegang & Tunjukkan") displayAction = "Aksi visual: Karakter memegang produk di tangannya menunjukkannya ke lensa.";
                else if (displayMethod === "Dipakai/Dikenakan") displayAction = "Aksi visual: Karakter memakai/mengenakan produk tersebut.";
                else if (displayMethod === "Diaplikasikan/Digunakan") displayAction = "Aksi visual: Karakter aktif menggunakan/mengaplikasikan produk.";
                else if (displayMethod === "Diletakkan Estetik") displayAction = "Aksi visual: Produk diletakkan diam secara estetik.";
                else if (displayMethod === "Produk Saja") displayAction = "Aksi visual: Fokus 100% B-Roll Cinematic Product Shot tanpa orang.";
                else if (displayMethod === "Zoom Detail") displayAction = "Aksi visual: Close-up makro menyorot detail tekstur produk.";

                const selectedUgc = ugcStylesList.find(s => s.value === ugcStyle);
                const ugcPrompt = selectedUgc ? `\nGaya Visual UGC: ${selectedUgc.value} (${selectedUgc.desc}).` : "";

                const finalBgLocation = bgLocation === 'Custom' ? bgLocationCustom : bgLocation;
                let bgPrompt = "";
                if (finalBgLocation) bgPrompt = `\nLatar belakang/lokasi adegan WAJIB DI: ${finalBgLocation}.`;
                let extraPrompt = productDetailExtra ? `\nDetail Tambahan Produk: ${productDetailExtra}.` : "";

                const numScenes = parseInt(sceneCount) || 4;

                const prompt = `Bertindaklah sebagai sutradara iklan affiliate. Buatkan naskah video vertikal 9:16 sejumlah tepat ${numScenes} Scene untuk produk "${productName}". Kategori: ${productCategory}. ${displayAction}. ${ugcPrompt} ${bgPrompt} ${extraPrompt}
                
                PENTING: 
                1. Buat tepat sebanyak ${numScenes} scene. Beri key objek json secara berurutan misal "1_SCENE", "2_SCENE", dst.
                2. Setiap scene sertakan "sound_effect" (suara latar/sfx pendukung yang detail dan sinematik).
                3. Di bagian "audio_options", berikan tepat 3 pilihan kalimat naskah Narasi Voice-Over yang berbeda-beda agar user bisa memilih.

                Output WAJIB JSON murni dengan format:
                {
                    "1_SCENE": { "duration": "8s", "visual": "...", "action": "...", "sound_effect": "...", "audio_options": ["pilihan 1", "pilihan 2", "pilihan 3"], "text_animation": "..." },
                    ...
                }`;

                try {
                    let resultText = await fetchGeminiText(prompt, true);
                    resultText = cleanJsonString(resultText);
                    const parsedData = JSON.parse(resultText);
                    
                    const initialPrompts = {};
                    for (const key in parsedData) {
                        initialPrompts[key] = `Buatkan foto cinematic super realistik rasio 9:16 vertikal. SETTING TEMPAT WAJIB DI: ${finalBgLocation || 'Studio'}. Fokus produk ${productName}. ${parsedData[key].visual} ${parsedData[key].action} Suara latar/SFX: ${parsedData[key].sound_effect}. Resolusi 8k DSLR.`;
                    }
                    setGeneratedData(parsedData);
                    setRawJsonText(JSON.stringify(parsedData, null, 4));
                    setEditablePrompts(initialPrompts);
                    setSceneImages({});
                } catch (err) {
                    console.error(err);
                    setGenError(`Koneksi AI Gagal: ${err.message}.`);
                } finally {
                    setIsGenerating(false);
                }
            };

            const handlePromptEdit = (key, value) => {
                setEditablePrompts(prev => ({ ...prev, [key]: value }));
            };

            const handleAudioOptionEdit = (sceneKey, optionIndex, newVal) => {
                if (!generatedData) return;
                const updated = JSON.parse(JSON.stringify(generatedData));
                if (updated[sceneKey] && updated[sceneKey].audio_options) {
                    updated[sceneKey].audio_options[optionIndex] = newVal;
                    setGeneratedData(updated);
                    setRawJsonText(JSON.stringify(updated, null, 4));
                }
            };

            const handleGenerateImage = async (sceneKey) => {
                setSceneIsGenerating(prev => ({ ...prev, [sceneKey]: true }));
                try {
                    let prompt = editablePrompts[sceneKey];
                    const imageUrl = await fetchGeminiImage(prompt, "9:16", productImagePreview, characterImagePreview, backgroundImagePreview);
                    setSceneImages(prev => ({ ...prev, [sceneKey]: imageUrl }));
                } catch (err) {
                    console.error(err);
                } finally {
                    setSceneIsGenerating(prev => ({ ...prev, [sceneKey]: false }));
                }
            };

            const handleSbGenerateImage = async () => {
                if (!sbProductImagePreview) {
                    setSbImageError("Upload gambar produk dulu bro!");
                    return;
                }
                setSbIsGeneratingImage(true);
                setSbStoryboardImagePreview(null);
                setSbImageError(null);
                
                try {
                    const finalSbBgLocation = sbBgLocation === 'Custom' ? sbBgLocationCustom : sbBgLocation;
                    let sbBgPrompt = finalSbBgLocation ? `SETTING TEMPAT WAJIB DI: ${finalSbBgLocation}.` : "";
                    const prompt = `Storyboard produk vertikal 9:16. ${sbProductName} ${sbProductCategory}. ${sbBgPrompt} ${sbProductDetailExtra} Foto realistik 8k DSLR.`;
                    
                    const imageUrl = await fetchGeminiImage(prompt, "9:16", sbProductImagePreview, sbCharacterImagePreview, sbBackgroundImagePreview);
                    setSbStoryboardImagePreview(imageUrl);
                } catch (err) {
                    setSbImageError("Gagal merender storyboard.");
                } finally {
                    setSbIsGeneratingImage(false);
                }
            };

            const handleSbGenerateVideoJson = async () => {
                setSbIsGeneratingVideo(true);
                setSbGeneratedVideoJson(null);
                setSbVideoError(null);
                
                const numScenes = parseInt(sbSceneCount) || 4;
                const prompt = `Buatkan prompt text-to-video JSON durasi vertikal 9:16 sebanyak ${numScenes} scene untuk produk ${sbProductName}. Setiap scene sertakan visual, action, sound_effect (sfx), dan audio_options narasi voice_over. Format JSON murni.`;

                try {
                    let jsonText = await fetchGeminiText(prompt, true);
                    jsonText = cleanJsonString(jsonText);
                    setSbGeneratedVideoJson(JSON.parse(jsonText));
                } catch (err) {
                    setSbVideoError(`Koneksi AI Gagal: ${err.message}`);
                } finally {
                    setSbIsGeneratingVideo(false);
                }
            };

            const handleResetTab1 = () => {
                setProductName(''); setProductCategory(''); setBgLocation(''); setBgLocationCustom('');
                setProductImage(null); setProductImagePreview(null);
                setCharacterImage(null); setCharacterImagePreview(null);
                setBackgroundImage(null); setBackgroundImagePreview(null);
                setUgcStyle(''); setDisplayMethod(''); setSceneCount('4'); setProductDetailExtra('');
                setGeneratedData(null);
            };

            const handleResetTab2 = () => {
                setSbProductName(''); setSbProductCategory(''); setSbBgLocation(''); setSbBgLocationCustom('');
                setSbProductImage(null); setSbProductImagePreview(null);
                setSbCharacterImage(null); setSbCharacterImagePreview(null);
                setSbBackgroundImage(null); setSbBackgroundImagePreview(null);
                setSbUgcStyle(''); setSbDisplayMethod(''); setSbAdditionalIdea(''); setSbSceneCount('4'); setSbProductDetailExtra('');
                setSbStoryboardImagePreview(null);
                setSbGeneratedVideoJson(null);
            };

            if (!isAuthorized) {
                return (
                    <div className="min-h-screen flex items-center justify-center relative z-10 p-4 font-inter">
                        <div className="glass-panel p-8 rounded-3xl max-w-sm w-full text-center animate-fade-in relative overflow-hidden shadow-2xl">
                            <div className="absolute top-0 left-1/2 transform -translate-x-1/2 w-40 h-40 bg-emerald-500/20 rounded-full blur-3xl pointer-events-none"></div>
                            
                            <div className="w-20 h-20 bg-gradient-to-br from-emerald-600 via-teal-600 to-green-600 rounded-2xl flex items-center justify-center mx-auto mb-6 shadow-[0_0_30px_rgba(16,185,129,0.4)] border border-white/20 p-1 relative z-10">
                                <img src="https://hosting.photobucket.com/fc8dad50-5cda-48ec-b957-92cd6d32fab2/6fe42ac8-50e4-415f-a5be-f043a5050900.png" alt="Logo" className="w-full h-full object-contain rounded-xl" />
                            </div>
                            
                            <h2 className="text-2xl font-extrabold text-white mb-2 relative z-10">Sistem Terkunci</h2>
                            <p className="text-xs text-slate-400 mb-8 relative z-10">Masukkan kode token akses untuk menggunakan AI Studio.</p>

                            <form onSubmit={handleTokenSubmit} className="relative z-10">
                                <div className="mb-5 relative">
                                    <i className="fa-solid fa-key absolute left-4 top-1/2 transform -translate-y-1/2 text-emerald-500"></i>
                                    <input 
                                        type={showToken ? "text" : "password"} 
                                        value={inputToken}
                                        onChange={(e) => setInputToken(e.target.value)}
                                        placeholder="Ketik Kode Token..." 
                                        className="w-full glass-input rounded-xl pl-10 pr-12 py-4 text-center tracking-widest font-mono text-emerald-400 focus:outline-none shadow-inner"
                                    />
                                    <button 
                                        type="button"
                                        onClick={() => setShowToken(!showToken)}
                                        className="absolute right-4 top-1/2 transform -translate-y-1/2 text-slate-400 hover:text-emerald-400 focus:outline-none transition-colors"
                                    >

                                        <div>
                                            <label className="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-2"><i className="fa-solid fa-align-left mr-2 text-emerald-400"></i>Detail Produk (opsional)</label>

                                </div>
                            </div>

                                                    <button onClick={() => setOutputViewMode('json')} className={`px-4 py-1.5 rounded-md text-[11px] font-bold transition-all ${outputViewMode === 'json' ? 'bg-teal-600 text-white' : 'text-slate-400 hover:text-white'}`}>Raw JSON</button>
                                                </div>
                                                <button onClick={() => { copyText(rawJsonText, 'fullJson'); }} className="bg-white/10 hover:bg-white/20 border border-white/10 text-white px-4 py-1.5 rounded-lg text-[11px] font-bold transition-all">
                                                    {copiedStatus['fullJson'] ? 'Copied!' : 'Copy'}
                                                </button>
                                            </div>
                                        )}
                                    </div>

                                    {!generatedData ? (
                                        <div className="flex-grow flex flex-col items-center justify-center text-slate-500 min-h-[400px]">
                                            <i className="fa-solid fa-wand-magic-sparkles text-6xl mb-6 opacity-20"></i>
                                            <p className="text-sm">Isi konfigurasi di panel kiri lalu klik Generate</p>
                                        </div>
                                    ) : (
                                        <div className="flex-grow overflow-hidden relative">
                                            {outputViewMode === 'json' && (
                                                <div className="absolute inset-0 animate-fade-in flex flex-col">
                                                    <textarea value={rawJsonText} onChange={(e) => setRawJsonText(e.target.value)} className="flex-grow w-full bg-[#030712] border border-white/10 rounded-xl p-5 text-[12px] text-emerald-400 font-mono resize-none focus:outline-none custom-scrollbar"></textarea>
                                                </div>
                                            )}

                                            {outputViewMode === 'visual' && (
                                                <div className="space-y-6 overflow-y-auto pr-2 custom-scrollbar h-full animate-fade-in" style={{maxHeight: '70vh'}}>

                                                                        <button onClick={() => copyText(`${data.visual} ${data.action} | SFX: ${data.sound_effect}`, key+'vis')} className="text-[10px] bg-white/10 hover:bg-white/20 text-white px-2 py-0.5 rounded opacity-0 group-hover/card:opacity-100 transition-opacity">
                                                                            {copiedStatus[key+'vis'] ? 'Copied!' : 'Copy'}
                                                                        </button>
                                                                    </div>
                                                                    <p className="text-xs text-slate-300 leading-relaxed mb-2">{data.visual} {data.action}</p>

                                                                                    <p className="text-[9px] text-emerald-400 font-bold uppercase tracking-wider"><i className="fa-solid fa-microphone mr-1"></i> Narasi: Voice-Over (Opsi {idx+1})</p>

                                                                                        onClick={() => copyText(`Narasi: Voice-Over\n${opt}`, `${key}_opt_${idx}`)} 
                                                                                        className="text-[9px] bg-white/10 hover:bg-emerald-600 text-white px-2 py-0.5 rounded transition-colors"
                                                                                        title="Copy Narasi + Kalimat Ini"
                                                                                    >
                                                                                        {copiedStatus[`${key}_opt_${idx}`] ? 'Copied!' : 'Copy'}
                                                                                    </button>
                                                                                </div>
                                                                                <input 
                                                                                    type="text" 
                                                                                    value={opt} 
                                                                                    onChange={(e) => handleAudioOptionEdit(key, idx, e.target.value)}
                                                                                    className="w-full bg-transparent text-xs text-slate-200 border-b border-white/10 focus:border-emerald-500 focus:outline-none py-1"
                                                                                />
                                                                            </div>
                                                                        ))}

                                                                    <p className="text-[11px] text-emerald-300 font-medium mt-3 bg-emerald-900/30 px-2 py-1 rounded inline-block">[{data.text_animation}]</p>

                                                                        {sceneIsGenerating[key] ? 'Rendering...' : 'Generate Image'}

                                                                    {sceneImages[key] && (

                                                                            <img src={sceneImages[key]} className="h-32 object-contain rounded-lg border border-white/10 bg-black" />
                                                                            <div className="absolute inset-0 bg-black/60 opacity-0 group-hover/img:opacity-100 transition-all flex items-center justify-center gap-2 rounded-lg">

                                                                            </div>
                                                                        </div>
                                                                    )}
                                                                </div>
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            )}
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* TAB 2: STORYBOARD UI */}

                        <div className="grid grid-cols-1 md:grid-cols-12 gap-8">

                                <div className="glass-panel rounded-3xl p-6 md:p-8 relative overflow-hidden group">

                                            <i className="fa-solid fa-rotate-right text-xs"></i>
                                        </button>
                                    </div>
                                    
                                    <div className="space-y-4 mb-6">
                                        <div>
                                            <label className="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-2"><i className="fa-solid fa-tag mr-2 text-emerald-400"></i>Nama Produk *</label>
                                            <input type="text" className="w-full glass-input rounded-xl px-4 py-3 text-sm" placeholder="Contoh: Sepatu Olahraga..." value={sbProductName} onChange={(e) => setSbProductName(e.target.value)} />

                                        <div className="grid grid-cols-2 gap-4">

                                                <label className="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-2"><i className="fa-solid fa-layer-group mr-2 text-teal-400"></i>Kategori</label>
                                                <select className="w-full glass-input rounded-xl px-4 py-3 text-sm appearance-none cursor-pointer" value={sbProductCategory} onChange={(e) => setSbProductCategory(e.target.value)}>
                                                    <option value="" className="text-slate-500">Pilih Kategori...</option>
                                                    {categories.map(cat => <option key={cat} value={cat} className="bg-slate-900 text-white">{cat}</option>)}
                                                </select>
                                            </div>
                                            <div>
                                                <label className="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-2"><i className="fa-solid fa-location-dot mr-2 text-lime-400"></i>Lokasi Tema</label>
                                                <select className="w-full glass-input rounded-xl px-4 py-3 text-sm appearance-none cursor-pointer" value={sbBgLocation} onChange={(e) => setSbBgLocation(e.target.value)}>
                                                    <option value="" className="text-slate-500">Pilih Tema...</option>

                                                <input type="text" className="w-full glass-input rounded-xl px-4 py-3 text-sm" placeholder="Misal: Hutan Amazon..." value={sbBgLocationCustom} onChange={(e) => setSbBgLocationCustom(e.target.value)} />

                                    <div className="grid grid-cols-3 gap-4 mb-6">
                                        <div className="space-y-2">
                                            <label className="text-[9px] font-bold text-slate-400 uppercase tracking-wider block text-center">Produk</label>
                                            <label className="flex flex-col items-center justify-center w-full h-24 border border-dashed glass-input rounded-xl cursor-pointer hover:border-emerald-400">
                                                {sbProductImagePreview ? <img src={sbProductImagePreview} className="max-h-full rounded object-contain p-1" /> : <i className="fa-solid fa-box-open text-slate-500 text-lg"></i>}
                                                <input type="file" className="hidden" accept="image/*" onChange={(e) => handleImageUpload(e, setSbProductImage, setSbProductImagePreview)} />
                                            </label>
                                        </div>
                                        <div className="space-y-2">
                                            <label className="text-[9px] font-bold text-slate-400 uppercase tracking-wider block text-center">Karakter</label>
                                            <label className="flex flex-col items-center justify-center w-full h-24 border border-dashed glass-input rounded-xl cursor-pointer hover:border-teal-400">
                                                {sbCharacterImagePreview ? <img src={sbCharacterImagePreview} className="max-h-full rounded object-contain p-1" /> : <i className="fa-regular fa-user text-slate-500 text-lg"></i>}
                                                <input type="file" className="hidden" accept="image/*" onChange={(e) => handleImageUpload(e, setSbCharacterImage, setSbCharacterImagePreview)} />
                                            </label>
                                        </div>
                                        <div className="space-y-2">
                                            <label className="text-[9px] font-bold text-slate-400 uppercase tracking-wider block text-center">Latar Asli</label>
                                            <label className="flex flex-col items-center justify-center w-full h-24 border border-dashed glass-input rounded-xl cursor-pointer hover:border-lime-400">
                                                {sbBackgroundImagePreview ? <img src={sbBackgroundImagePreview} className="max-h-full rounded object-contain p-1" /> : <i className="fa-regular fa-image text-slate-500 text-lg"></i>}
                                                <input type="file" className="hidden" accept="image/*" onChange={(e) => handleImageUpload(e, setSbBackgroundImage, setSbBackgroundImagePreview)} />
                                            </label>
                                        </div>
                                    </div>

                                    <div className="space-y-4 mb-6 border-t border-white/5 pt-5">
                                        <div>
                                            <label className="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-2"><i className="fa-solid fa-mobile-screen mr-2 text-indigo-400"></i>Gaya Visual UGC</label>
                                            <select className="w-full glass-input rounded-xl px-4 py-3 text-sm appearance-none cursor-pointer" value={sbUgcStyle} onChange={(e) => setSbUgcStyle(e.target.value)}>
                                                <option value="" className="text-slate-500">Pilih Gaya UGC...</option>
                                                {ugcStylesList.map(style => <option key={style.label} value={style.value} className="bg-slate-900 text-white">{style.label}</option>)}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-2"><i className="fa-solid fa-camera mr-2 text-rose-400"></i>Cara Tampil Produk</label>
                                            <select className="w-full glass-input rounded-xl px-4 py-3 text-sm appearance-none cursor-pointer" value={sbDisplayMethod} onChange={(e) => setSbDisplayMethod(e.target.value)}>
                                                <option value="" className="text-slate-500">Pilih Aksi...</option>
                                                {displayMethods.map(method => <option key={method.value} value={method.value} className="bg-slate-900 text-white">{method.label}</option>)}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-2"><i className="fa-solid fa-film mr-2 text-amber-400"></i>Jumlah Scene</label>
                                            <select className="w-full glass-input rounded-xl px-4 py-3 text-sm appearance-none cursor-pointer" value={sbSceneCount} onChange={(e) => setSbSceneCount(e.target.value)}>
                                                {[1,2,3,4,5,6,7,8,9].map(num => <option key={num} value={num} className="bg-slate-900 text-white">{num} Scene</option>)}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-2"><i className="fa-solid fa-align-left mr-2 text-emerald-400"></i>Detail Produk (opsional)</label>
                                            <textarea rows="2" className="w-full glass-input rounded-xl p-3 text-sm resize-none" placeholder="Tuliskan detail khusus produk..." value={sbProductDetailExtra} onChange={(e) => setSbProductDetailExtra(e.target.value)}></textarea>
                                        </div>
                                        <div>
                                            <label className="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-2"><i className="fa-solid fa-lightbulb mr-2 text-amber-400"></i>Tambahan Ide Kustom</label>
                                            <textarea rows="2" className="w-full glass-input rounded-xl p-3 text-sm resize-none" placeholder="Tulis instruksi khusus..." value={sbAdditionalIdea} onChange={(e) => setSbAdditionalIdea(e.target.value)}></textarea>
                                        </div>
                                    </div>

                                    <div className="flex gap-4 mt-8">
                                        <button onClick={handleSbGenerateImage} disabled={sbIsGeneratingImage} className={`flex-1 py-4 rounded-xl font-bold text-xs tracking-wide flex justify-center items-center gap-2 border-none transition-all ${sbIsGeneratingImage ? 'bg-slate-800 text-slate-500' : 'bg-gradient-to-r from-teal-600 to-emerald-600 text-white shadow-[0_0_20px_rgba(20,184,166,0.3)]'}`}>
                                            {sbIsGeneratingImage ? 'Rendering...' : 'Storyboard Image'}
                                        </button>
                                        <button onClick={handleSbGenerateVideoJson} disabled={sbIsGeneratingVideo} className={`flex-1 py-4 rounded-xl font-bold text-xs tracking-wide flex justify-center items-center gap-2 border-none transition-all ${sbIsGeneratingVideo ? 'bg-slate-800 text-slate-500' : 'bg-gradient-to-r from-indigo-600 to-blue-600 text-white shadow-[0_0_20px_rgba(79,70,229,0.3)]'}`}>
                                            {sbIsGeneratingVideo ? 'Meracik...' : 'Video Prompt (JSON)'}
                                        </button>
                                    </div>
                                </div>
                            </div>

                            <div className="md:col-span-7 flex flex-col h-full space-y-6">
                                <div className="glass-panel rounded-3xl p-6 relative overflow-hidden border border-white/5">
                                    <h2 className="text-sm font-bold text-white flex items-center gap-2 mb-4"><i className="fa-solid fa-image text-teal-400"></i> Hasil Storyboard (9:16)</h2>
                                    <div className="bg-[#030712] rounded-2xl min-h-[400px] flex items-center justify-center border border-white/5 relative overflow-hidden group/sb">
                                        {sbIsGeneratingImage ? (
                                            <div className="flex flex-col items-center text-teal-500 animate-pulse"><i className="fa-solid fa-cube fa-spin text-4xl mb-4"></i><p className="text-xs font-bold">RENDERING...</p></div>
                                        ) : sbStoryboardImagePreview ? (
                                            <>
                                                <img src={sbStoryboardImagePreview} className="max-h-[600px] object-contain rounded-xl shadow-2xl" />
                                                <div className="absolute inset-0 bg-black/50 opacity-0 group-hover/sb:opacity-100 transition-all flex items-center justify-center gap-4">
                                                    <button onClick={() => setFullscreenImage(sbStoryboardImagePreview)} className="w-12 h-12 bg-teal-600 text-white rounded-full flex items-center justify-center shadow-xl"><i className="fa-solid fa-expand"></i></button>
                                                    <button onClick={() => downloadImage(sbStoryboardImagePreview, 'Storyboard.png')} className="w-12 h-12 bg-white text-slate-900 rounded-full flex items-center justify-center shadow-xl"><i className="fa-solid fa-download"></i></button>
                                                </div>
                                            </>
                                        ) : (
                                            <div className="text-slate-600 flex flex-col items-center"><i className="fa-solid fa-image text-4xl mb-3 opacity-20"></i><p className="text-xs">Klik Storyboard Image</p></div>
                                        )}
                                        {sbImageError && <div className="absolute bottom-4 left-4 right-4 bg-red-500/90 text-white text-[10px] p-2 rounded-lg text-center font-bold">{sbImageError}</div>}
                                    </div>
                                </div>

                                <div className="glass-panel rounded-3xl p-6 flex-grow flex flex-col relative border border-white/5">
                                    <div className="flex justify-between items-center mb-4">
                                        <h2 className="text-sm font-bold text-white flex items-center gap-2"><i className="fa-solid fa-code text-indigo-400"></i> Text-to-Video Prompt</h2>
                                        {sbGeneratedVideoJson && (
                                            <button onClick={() => copyText(JSON.stringify(sbGeneratedVideoJson, null, 4), 'sbJson')} className="text-slate-400 hover:text-white text-xs bg-white/10 px-3 py-1.5 rounded-lg border border-white/10">
                                                {copiedStatus['sbJson'] ? 'Copied!' : 'Copy JSON'}
                                            </button>
                                        )}
                                    </div>
                                    <div className="flex-grow relative bg-[#030712] rounded-2xl border border-white/5 overflow-hidden min-h-[250px]">
                                        {sbIsGeneratingVideo ? (
                                            <div className="absolute inset-0 flex flex-col items-center justify-center text-indigo-500 animate-pulse"><i className="fa-solid fa-microchip fa-spin text-4xl mb-4"></i><p className="text-xs font-bold">MERACIK...</p></div>
                                        ) : sbGeneratedVideoJson ? (
                                            <textarea readOnly value={JSON.stringify(sbGeneratedVideoJson, null, 4)} className="absolute inset-0 w-full h-full bg-transparent text-indigo-300 font-mono text-[11px] p-5 resize-none focus:outline-none custom-scrollbar"></textarea>
                                        ) : (
                                            <div className="absolute inset-0 flex flex-col items-center justify-center text-slate-600"><i className="fa-solid fa-terminal text-4xl mb-3 opacity-20"></i><p className="text-xs">Klik Video Prompt</p></div>
                                        )}
                                        {sbVideoError && <div className="absolute bottom-4 left-4 right-4 bg-red-500/90 text-white text-[10px] p-2 rounded-lg text-center font-bold">{sbVideoError}</div>}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    {fullscreenImage && (
                        <div className="fixed inset-0 z-[100] bg-black/90 backdrop-blur-sm flex items-center justify-center p-4 animate-fade-in" onClick={() => setFullscreenImage(null)}>
                            <button className="absolute top-6 right-6 text-white bg-white/10 hover:bg-red-500 rounded-full w-12 h-12 flex items-center justify-center transition-all shadow-2xl z-50">
                                <i className="fa-solid fa-xmark text-xl"></i>
                            </button>
                            <img src={fullscreenImage} className="max-h-[90vh] max-w-[95vw] rounded-2xl shadow-[0_0_50px_rgba(20,184,166,0.3)] object-contain relative z-40" onClick={(e) => e.stopPropagation()} />
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
